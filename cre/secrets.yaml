# Secrets the CRE workflows read with runtime.getSecret(). Values never go in git or in a config file:
# each secret names the environment variable that holds its value.
#   Simulation: `cre workflow simulate` reads the variable from cre/.env (see .env.example).
#   Deployed:   `cre secrets create ./secrets.yaml -T production-settings` stores the value in the Vault DON.
#
# WATCH_TOKEN (canary-watch, local-settings and production-settings): a bearer token the workflow sends
#   when it fetches the watch list from the Canary app (/api/watch/snapshot?list=1). The app checks it
#   against its own WATCH_TOKEN. Leave CANARY_WATCH_TOKEN empty for a public fetch (the app's default).
secretsNames:
  WATCH_TOKEN:
    - CANARY_WATCH_TOKEN
